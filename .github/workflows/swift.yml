name: Build Framework
on: push: branches: [ "main", "master" ] pull_request: branches: [ "main", "master" ] workflow_dispatch:
jobs: build: runs-on: macos-latest
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Select Xcode Version
    run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

  - name: Build Framework via xcodebuild
    run: |
      # 1. Сборка для iOS устройства (arm64)
      xcodebuild archive \
        -scheme ErosionUIBridge \
        -destination "generic/platform=iOS" \
        -archivePath ./build/ios.xcarchive \
        SKIP_INSTALL=NO \
        BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      # 2. Сборка для iOS Симулятора (arm64/x86_64)
      xcodebuild archive \
        -scheme ErosionUIBridge \
        -destination "generic/platform=iOS Simulator" \
        -archivePath ./build/ios_sim.xcarchive \
        SKIP_INSTALL=NO \
        BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      # 3. Объединение в единый .xcframework
      xcodebuild -create-xcframework \
        -framework ./build/ios.xcarchive/Products/Library/Frameworks/ErosionUIBridge.framework \
        -framework ./build/ios_sim.xcarchive/Products/Library/Frameworks/ErosionUIBridge.framework \
        -output ./build/ErosionUIBridge.xcframework

  - name: Compress Framework to ZIP
    run: |
      cd build
      zip -r ErosionUIBridge.xcframework.zip ErosionUIBridge.xcframework

  - name: Upload Framework Artifact
    uses: actions/upload-artifact@v4
    with:
      name: ErosionUIBridge.xcframework
      path: build/ErosionUIBridge.xcframework.zip
