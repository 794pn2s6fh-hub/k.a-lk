name: Build ErosionUIBridge

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: List package schemes
        run: xcodebuild -list

      - name: Archive iOS framework
        run: |
          xcodebuild archive \
            -scheme ErosionUIBridge \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/ErosionUIBridge.xcarchive" \
            -configuration Release \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Locate framework
        run: |
          find "$PWD/ErosionUIBridge.xcarchive" \
            -name "ErosionUIBridge.framework" \
            -type d \
            -print

      - name: Package framework
        run: |
          mkdir -p artifact

          FRAMEWORK=$(find "$PWD/ErosionUIBridge.xcarchive" \
            -name "ErosionUIBridge.framework" \
            -type d | head -n 1)

          if [ -z "$FRAMEWORK" ]; then
            echo "ERROR: ErosionUIBridge.framework not found"
            exit 1
          fi

          echo "Framework found:"
          echo "$FRAMEWORK"

          ditto "$FRAMEWORK" \
            "artifact/ErosionUIBridge.framework"

          cd artifact
          zip -r ErosionUIBridge.framework.zip \
            ErosionUIBridge.framework

      - name: Upload framework
        uses: actions/upload-artifact@v4
        with:
          name: ErosionUIBridge-iOS
          path: artifact/ErosionUIBridge.framework.zip
