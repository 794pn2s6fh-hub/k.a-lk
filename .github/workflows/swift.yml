name: Build ErosionUIBridge

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          DEVELOPER_DIR=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" -o -name "Xcode.app" | tail -n 1)
          sudo xcode-select -s "$DEVELOPER_DIR/Contents/Developer"
          xcodebuild -version

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -scheme ErosionUIBridge

      - name: Build iOS framework
        run: |
          xcodebuild \
            -scheme ErosionUIBridge \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            -sdk iphoneos \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            SKIP_INSTALL=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package framework
        run: |
          mkdir -p artifact
          FRAMEWORK=$(find build -name "ErosionUIBridge.framework" -type d | head -n 1)
          if [ -z "$FRAMEWORK" ]; then
            echo "ERROR: Framework not found"
            exit 1
          fi
          ditto "$FRAMEWORK" "artifact/ErosionUIBridge.framework"
          cd artifact
          zip -r ErosionUIBridge.framework.zip ErosionUIBridge.framework

      - name: Upload framework
        uses: actions/upload-artifact@v4
        with:
          name: ErosionUIBridge-iOS
          path: artifact/ErosionUIBridge.framework.zip
